# ============================================================
# 每日信息汇总 · 信息源配置
# 改这个文件就能增删信息源，不用动代码。
# 改完提交后会自动重新生成一次页面。
#
# 每个信息源的写法（三选一）：
#   1) RSS 订阅：      type: rss    url: 订阅地址
#   2) 新闻关键词检索：type: news   query: 检索词   lang: zh 或 en
#      （默认用必应新闻的公开 RSS，点开直接是原文；可用 OR 连接多个词，英文词组加引号）
#   3) 网页列表抓取：  type: html   url: 列表页地址   selector: 链接的 CSS 选择器
#
# 可选项：limit: 每天最多收录几条（默认 20）
# ============================================================

settings:
  title: 每日信息汇总
  # 只收录多少天以内发布的内容（防止把旧文章当新的）
  max_age_days: 3
  # 页面保留多少天的历史
  keep_days: 60
  default_limit: 20
  # 新闻检索用哪家：bing（点开直接是原文，国内可访问）或 google
  news_provider: bing
  # 关注词分组的权重，越大越容易排进"今日重点"
  keyword_weights:
    民爆: 3
    非洲: 2

# 关注词：标题或摘要命中的条目会高亮并排在前面
# 英文不区分大小写
keywords:
  民爆:
    - 民爆
    - 炸药
    - 雷管
    - 爆破
    - 硝酸铵
    - 乳化
    - ammonium nitrate
    - explosive
    - detonator
    - blasting
    - Orica
    - Dyno Nobel
    - Enaex
    - MAXAM
    - AECI
    - Omnia
    - Austin Powder
    - Solar Industries
    - 易普力
    - 广东宏大
    - 江南化工
    - 雪峰科技
    - 保利联合
  非洲:
    - Nigeria
    - Nigerian
    - 尼日利亚
    - West Africa
    - 西非

# 排除词：标题里含有这些词的条目直接不收（用来过滤股票行情等噪音）
exclude:
  - 主力资金
  - 行情快报
  - 资金流向
  - 民爆光电
  - Seasonal returns chart
  - stock price target
  - Gold Rate Today
  - gold rate in
  - 基金份额

categories:
  - id: explosives
    name: 民爆
    sources:
      - name: 国际民爆企业
        type: news
        lang: en
        query: Orica OR "Dyno Nobel" OR Enaex OR MAXAM OR "AECI Mining" OR "BME mining" OR "Austin Powder"
      - name: 硝酸铵市场
        type: news
        lang: en
        query: '"ammonium nitrate" (price OR market OR plant OR explosives)'
        limit: 15
      - name: 爆破技术与安全（英文）
        type: news
        lang: en
        query: blasting mine OR "mining explosives" OR "electronic detonators"
        limit: 15
      - name: 民爆行业
        type: news
        lang: zh
        query: 民爆 OR 民用爆炸物品 OR 工业炸药 OR 电子雷管
      - name: 国内民爆企业
        type: news
        lang: zh
        query: 易普力 OR 广东宏大 OR 江南化工 OR 雪峰科技 OR 凯龙股份 OR 保利联合 OR 国泰集团 OR 高争民爆 OR 金奥博
      - name: 硝酸铵（中文）
        type: news
        lang: zh
        query: 硝酸铵
        limit: 10

  - id: mining
    name: 矿业
    sources:
      - name: MINING.COM
        type: rss
        url: https://www.mining.com/feed/
      - name: International Mining
        type: rss
        url: https://im-mining.com/feed/
      - name: The Northern Miner
        type: rss
        url: https://www.northernminer.com/feed/
      - name: 非洲矿业新闻
        type: news
        lang: en
        query: Africa mining OR "West Africa gold"
        limit: 15
      - name: Mining Review Africa
        type: news
        lang: en
        query: site:miningreview.com
        limit: 10
      - name: Australian Mining
        type: rss
        url: https://www.australianmining.com.au/feed/
      - name: 尼日利亚矿业新闻
        type: news
        lang: en
        region: NG
        query: Nigeria mining OR "solid minerals"
        limit: 15
      - name: 黄金市场新闻
        type: news
        lang: en
        query: '"gold price" OR "gold miners"'
        limit: 10
      - name: 中文矿业新闻
        type: news
        lang: zh
        query: 矿业 OR 金矿 OR 铜矿
        limit: 15

  - id: ai
    name: AI 进展
    sources:
      - name: OpenAI
        type: rss
        url: https://openai.com/news/rss.xml
      - name: Anthropic
        type: html
        url: https://www.anthropic.com/news
        selector: 'a[href^="/news/"]'
        limit: 8
      - name: Google DeepMind
        type: rss
        url: https://deepmind.google/blog/rss.xml
      - name: Google Research
        type: rss
        url: https://research.google/blog/rss/
      - name: Hugging Face 博客
        type: rss
        url: https://huggingface.co/blog/feed.xml
      - name: MIT 科技评论 · AI
        type: rss
        url: https://www.technologyreview.com/topic/artificial-intelligence/feed
      - name: The Verge · AI
        type: rss
        url: https://www.theverge.com/rss/ai-artificial-intelligence/index.xml
      - name: Simon Willison
        type: rss
        url: https://simonwillison.net/atom/everything/
        limit: 10
      - name: 量子位
        type: rss
        url: https://www.qbitai.com/feed
      - name: 中文 AI 新闻
        type: news
        lang: zh
        query: 大模型 OR 人工智能 发布
        limit: 15

  - id: tech
    name: 技术博客
    sources:
      - name: Hacker News 热门
        type: rss
        url: https://hnrss.org/frontpage?points=200
        limit: 25
      - name: GitHub Blog
        type: rss
        url: https://github.blog/feed/
      - name: Cloudflare Blog
        type: rss
        url: https://blog.cloudflare.com/rss/
      - name: InfoQ
        type: rss
        url: https://feed.infoq.com/
        limit: 15
      - name: Ars Technica
        type: rss
        url: https://feeds.arstechnica.com/arstechnica/index
        limit: 15
      - name: 阮一峰的网络日志
        type: rss
        url: https://www.ruanyifeng.com/blog/atom.xml
      - name: 少数派
        type: rss
        url: https://sspai.com/feed
        limit: 15
      - name: 美团技术团队
        type: rss
        url: https://tech.meituan.com/feed/
