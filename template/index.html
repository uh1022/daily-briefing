<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日信息汇总</title>
<style>
  :root {
    --bg: #f6f5f1;
    --paper: #ffffff;
    --ink: #1d1d1b;
    --muted: #6d6a63;
    --line: #e4e1d8;
    --accent: #b4441c;
    --accent-soft: #fbeee6;
    --chip: #f0ede5;
    --ok: #2f7a4b;
    --err: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --paper: #1f1f1c; --ink: #ecebe6; --muted: #9c998f;
      --line: #33322e; --accent: #f08a5d; --accent-soft: #3a2519; --chip: #2a2925;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.6 -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  .wrap { max-width: 920px; margin: 0 auto; padding: 0 16px 60px; }
  header { padding: 28px 0 12px; display: flex; flex-wrap: wrap; align-items: end; gap: 12px 20px; justify-content: space-between; }
  h1 { margin: 0; font-size: 26px; letter-spacing: .02em; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  select, input[type=search] {
    font: inherit; font-size: 14px; padding: 6px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--paper); color: var(--ink);
  }
  input[type=search] { width: 180px; }
  nav.tabs {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    display: flex; gap: 4px; overflow-x: auto; padding: 10px 0; border-bottom: 1px solid var(--line);
  }
  nav.tabs { scrollbar-width: none; }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button {
    font: inherit; font-size: 14px; border: 0; background: transparent; color: var(--muted);
    padding: 6px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  }
  nav.tabs button .n { font-size: 12px; margin-left: 4px; opacity: .8; }
  nav.tabs button.on { background: var(--ink); color: var(--bg); }
  nav.tabs button.hot.on { background: var(--accent); color: #fff; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin: 14px 0 6px; color: var(--muted); font-size: 13px; }
  .bar label { cursor: pointer; user-select: none; }
  .group-title { margin: 22px 0 6px; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
  ul.items { list-style: none; margin: 0; padding: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  ul.items li { padding: 12px 16px; border-top: 1px solid var(--line); }
  ul.items li:first-child { border-top: 0; }
  ul.items li.hit { background: linear-gradient(90deg, var(--accent-soft), transparent 60%); box-shadow: inset 3px 0 0 var(--accent); }
  a.t { color: var(--ink); text-decoration: none; font-weight: 600; font-size: 15.5px; }
  a.t:hover { color: var(--accent); text-decoration: underline; }
  a.t:visited { color: var(--muted); }
  .meta { font-size: 12.5px; color: var(--muted); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .src { background: var(--chip); padding: 1px 8px; border-radius: 6px; }
  .kw { color: var(--accent); font-weight: 600; }
  .sum { margin-top: 4px; font-size: 13.5px; color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  footer { margin-top: 28px; font-size: 13px; color: var(--muted); }
  details summary { cursor: pointer; }
  table.st { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; background: var(--paper); border-radius: 10px; overflow: hidden; }
  table.st td, table.st th { padding: 6px 10px; border-top: 1px solid var(--line); text-align: left; }
  table.st th { font-weight: 600; background: var(--chip); border-top: 0; }
  .ok { color: var(--ok); } .err { color: var(--err); }
  @media (max-width: 600px) {
    h1 { font-size: 22px; }
    input[type=search] { width: 130px; }
    ul.items li { padding: 11px 13px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="title">每日信息汇总</h1>
      <div class="sub" id="sub">加载中…</div>
    </div>
    <div class="controls">
      <select id="date" aria-label="选择日期"></select>
      <input type="search" id="q" placeholder="在当天内容中搜索" aria-label="搜索">
    </div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <div class="bar">
    <span id="count"></span>
    <label><input type="checkbox" id="bysrc"> 按来源分组</label>
  </div>
  <main id="list"></main>
  <footer id="foot"></footer>
</div>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  let day = null, tab = store.get("tab") || "hot";
  $("bysrc").checked = store.get("bysrc") === "1";

  function fmtTime(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    const bj = new Date(d.getTime() + (d.getTimezoneOffset() + 480) * 60000);
    const p = (n) => String(n).padStart(2, "0");
    return `${p(bj.getMonth() + 1)}-${p(bj.getDate())} ${p(bj.getHours())}:${p(bj.getMinutes())}`;
  }

  async function getJSON(path) {
    const r = await fetch(path + "?v=" + Date.now());
    if (!r.ok) throw new Error(path + " " + r.status);
    return r.json();
  }

  async function init() {
    try {
      const idx = await getJSON("data/index.json");
      document.title = idx.title; $("title").textContent = idx.title;
      if (!idx.dates.length) { $("sub").textContent = "还没有数据"; return; }
      $("date").innerHTML = idx.dates.map((d) => `<option value="${d}">${d}</option>`).join("");
      const want = (location.hash.match(/date=([\d-]+)/) || [])[1];
      if (want && idx.dates.includes(want)) $("date").value = want;
      await loadDay($("date").value);
    } catch (e) {
      $("sub").textContent = "加载失败：" + e.message;
    }
  }

  async function loadDay(d) {
    $("list").innerHTML = '<div class="empty">加载中…</div>';
    day = await getJSON(`data/days/${d}.json`);
    history.replaceState(null, "", "#date=" + d);
    const ok = day.status.filter((s) => s.ok).length;
    $("sub").textContent = `${day.date} · 更新于 ${day.generated_at.slice(11, 16)}（北京时间）· 共 ${day.items.length} 条`;
    renderTabs(); render(); renderFoot(ok);
  }

  function filtered(cat) {
    const q = $("q").value.trim().toLowerCase();
    return day.items.filter((it) => {
      if (cat === "hot" && !it.hits.length) return false;
      if (cat !== "hot" && cat !== "all" && it.category !== cat) return false;
      if (q && !(it.title + " " + it.summary + " " + it.source + " " + it.origin).toLowerCase().includes(q)) return false;
      return true;
    });
  }

  function renderTabs() {
    const tabs = [{ id: "hot", name: "关注词命中" }, { id: "all", name: "全部" }].concat(day.categories);
    if (!tabs.some((t) => t.id === tab)) tab = "hot";
    $("tabs").innerHTML = tabs.map((t) =>
      `<button data-id="${t.id}" class="${t.id === tab ? "on" : ""} ${t.id === "hot" ? "hot" : ""}">${esc(t.name)}<span class="n">${filtered(t.id).length}</span></button>`
    ).join("");
  }

  function itemHTML(it) {
    const kws = it.hits.length ? `<span class="kw">● ${it.hits.map(esc).join(" · ")}</span>` : "";
    const origin = it.origin ? ` · ${esc(it.origin)}` : "";
    const time = fmtTime(it.published);
    return `<li class="${it.hits.length ? "hit" : ""}">
      <a class="t" href="${esc(it.link)}" target="_blank" rel="noopener">${esc(it.title)}</a>
      <div class="meta"><span class="src">${esc(it.source)}${origin}</span>${time ? `<span>${time}</span>` : ""}${kws}</div>
      ${it.summary ? `<div class="sum">${esc(it.summary)}</div>` : ""}
    </li>`;
  }

  function sortItems(arr) {
    return arr.slice().sort((a, b) => (b.hits.length > 0) - (a.hits.length > 0) || String(b.published || "").localeCompare(String(a.published || "")));
  }

  function render() {
    const items = sortItems(filtered(tab));
    $("count").textContent = `${items.length} 条`;
    if (!items.length) {
      $("list").innerHTML = `<div class="empty">${tab === "hot" ? "今天没有命中关注词的内容" : "没有内容"}</div>`;
      return;
    }
    if ($("bysrc").checked) {
      const groups = new Map();
      items.forEach((it) => { if (!groups.has(it.source)) groups.set(it.source, []); groups.get(it.source).push(it); });
      $("list").innerHTML = [...groups].map(([name, arr]) =>
        `<div class="group-title">${esc(name)} · ${arr.length}</div><ul class="items">${arr.map(itemHTML).join("")}</ul>`).join("");
    } else {
      $("list").innerHTML = `<ul class="items">${items.map(itemHTML).join("")}</ul>`;
    }
  }

  function renderFoot(ok) {
    const bad = day.status.filter((s) => !s.ok);
    const catName = Object.fromEntries(day.categories.map((c) => [c.id, c.name]));
    const rows = day.status.map((s) =>
      `<tr><td>${esc(catName[s.category] || s.category)}</td><td>${esc(s.name)}</td>
       <td class="${s.ok ? "ok" : "err"}">${s.ok ? "正常" : "失败"}</td><td>${s.ok ? s.new : ""}</td><td>${esc(s.error)}</td></tr>`).join("");
    $("foot").innerHTML = `<details ${bad.length ? "" : ""}><summary>信息源 ${ok}/${day.status.length} 正常${bad.length ? `，<span class="err">${bad.length} 个失败</span>` : ""}（点击查看）</summary>
      <table class="st"><tr><th>分类</th><th>信息源</th><th>状态</th><th>当天条数</th><th>说明</th></tr>${rows}</table></details>`;
  }

  $("tabs").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    tab = b.dataset.id; store.set("tab", tab); renderTabs(); render(); window.scrollTo({ top: 0 });
  });
  $("date").addEventListener("change", () => loadDay($("date").value));
  $("q").addEventListener("input", () => { renderTabs(); render(); });
  $("bysrc").addEventListener("change", () => { store.set("bysrc", $("bysrc").checked ? "1" : "0"); render(); });
  init();
})();
</script>
</body>
</html>
