<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日信息汇总</title>
<style>
  :root {
    --bg: #f5f4ef; --paper: #ffffff; --ink: #1c1c1a; --muted: #6b6860; --faint: #9a968c;
    --line: #e3e0d6; --accent: #b4441c; --accent-soft: #fbefe8; --chip: #efece4;
    --ok: #2f7a4b; --err: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151513; --paper: #1e1e1b; --ink: #ecebe6; --muted: #a29f95; --faint: #75726a;
      --line: #32312d; --accent: #f08a5d; --accent-soft: #33221a; --chip: #2a2925; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.65 -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif; }
  a { color: inherit; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 16px 64px; }
  header { padding: 28px 0 10px; display: flex; flex-wrap: wrap; align-items: end; gap: 10px 20px; justify-content: space-between; }
  h1 { margin: 0; font-size: 26px; letter-spacing: .02em; }
  .sub { color: var(--muted); font-size: 13px; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; }
  select, input[type=search] { font: inherit; font-size: 14px; padding: 6px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--paper); color: var(--ink); }
  input[type=search] { width: 170px; }
  nav.tabs { position: sticky; top: 0; z-index: 5; background: var(--bg); display: flex; gap: 4px;
    overflow-x: auto; padding: 10px 0; border-bottom: 1px solid var(--line); scrollbar-width: none; }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button { font: inherit; font-size: 14px; border: 0; background: transparent; color: var(--muted);
    padding: 6px 13px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  nav.tabs button .n { font-size: 12px; margin-left: 4px; opacity: .75; }
  nav.tabs button.on { background: var(--ink); color: var(--bg); }

  section.cat { margin-top: 26px; }
  .cat-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .cat-head h2 { margin: 0; font-size: 19px; }
  .cat-head button { font: inherit; font-size: 13px; color: var(--accent); background: none; border: 0; cursor: pointer; padding: 0; }
  .summary { background: var(--paper); border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: 10px; padding: 12px 16px; margin: 0 0 12px; font-size: 15px; }
  .summary .lbl { font-size: 12px; color: var(--accent); font-weight: 700; letter-spacing: .08em; margin-bottom: 2px; }

  ol.hl { list-style: none; margin: 0; padding: 0; counter-reset: hl; }
  ol.hl > li { counter-increment: hl; position: relative; background: var(--paper); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px 16px 12px 52px; margin-bottom: 10px; }
  ol.hl > li::before { content: counter(hl); position: absolute; left: 16px; top: 13px; width: 24px; height: 24px;
    border-radius: 50%; background: var(--accent); color: #fff; font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; }
  .hl-title { font-size: 16.5px; font-weight: 700; line-height: 1.45; text-decoration: none; }
  .hl-title:hover { color: var(--accent); text-decoration: underline; }
  .hl-orig { font-size: 12.5px; color: var(--faint); margin-top: 2px; }
  .hl-point { margin-top: 5px; color: var(--ink); font-size: 14.5px; }
  .meta { font-size: 12.5px; color: var(--muted); margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
  .cnt { background: var(--accent-soft); color: var(--accent); font-weight: 600; padding: 0 8px; border-radius: 6px; }
  .src { background: var(--chip); padding: 0 8px; border-radius: 6px; text-decoration: none; }
  a.src:hover { color: var(--accent); }
  .kw { color: var(--accent); }

  .more-title { margin: 22px 0 6px; font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .06em; }
  ul.rest { list-style: none; margin: 0; padding: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  ul.rest > li { padding: 10px 16px; border-top: 1px solid var(--line); }
  ul.rest > li:first-child { border-top: 0; }
  ul.rest a.t { text-decoration: none; font-weight: 600; font-size: 14.5px; }
  ul.rest a.t:hover { color: var(--accent); text-decoration: underline; }
  details.srcs summary { cursor: pointer; list-style: none; display: inline; }
  details.srcs summary::-webkit-details-marker { display: none; }
  details.srcs ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; color: var(--muted); }
  details.srcs ul a { text-decoration: none; } details.srcs ul a:hover { text-decoration: underline; }
  button.expand { margin-top: 8px; font: inherit; font-size: 13px; color: var(--muted); background: var(--paper);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; width: 100%; }
  .empty { text-align: center; color: var(--muted); padding: 36px 0; }
  footer { margin-top: 32px; font-size: 12.5px; color: var(--muted); }
  footer p { margin: 4px 0; }
  details.st summary { cursor: pointer; }
  table.st { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12.5px; background: var(--paper); }
  table.st td, table.st th { padding: 5px 10px; border-top: 1px solid var(--line); text-align: left; }
  table.st th { background: var(--chip); border-top: 0; }
  .ok { color: var(--ok); } .err { color: var(--err); }
  @media (max-width: 600px) {
    h1 { font-size: 22px; } input[type=search] { width: 130px; }
    ol.hl > li { padding: 12px 13px 11px 44px; } ol.hl > li::before { left: 12px; }
    ul.rest > li { padding: 10px 13px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="title">每日信息汇总</h1>
      <div class="sub" id="sub">加载中…</div>
    </div>
    <div class="controls">
      <select id="date" aria-label="选择日期"></select>
      <input type="search" id="q" placeholder="搜索当天内容" aria-label="搜索">
    </div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="main"></main>
  <footer id="foot"></footer>
</div>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  const HL_MAX = 5, OVERVIEW_HL = 3, REST_SHOW = 15;
  let day = null, tab = store.get("tab2") || "overview", items = {}, clusters = {}, expanded = {};

  function fmtTime(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    const bj = new Date(d.getTime() + (d.getTimezoneOffset() + 480) * 60000);
    const p = (n) => String(n).padStart(2, "0");
    return `${p(bj.getMonth() + 1)}-${p(bj.getDate())} ${p(bj.getHours())}:${p(bj.getMinutes())}`;
  }
  async function getJSON(path) {
    const r = await fetch(path + "?v=" + Date.now());
    if (!r.ok) throw new Error(path + " " + r.status);
    return r.json();
  }
  const pub = (it) => it.origin || it.source;
  const zhTitle = (c) => { const r = items[c.rep]; return (r && r.title_zh) || c.title; };

  // 每个分类的：综述、重点（含合并的事件）、其余事件
  function plan(catId) {
    const cl = day.clusters.filter((c) => c.category === catId);
    const dg = day.digest && day.digest.categories && day.digest.categories[catId];
    let highlights;
    if (dg && dg.highlights && dg.highlights.length) {
      highlights = dg.highlights.map((h) => {
        const cs = h.ids.map((id) => clusters[id]).filter(Boolean);
        return { headline: h.headline, point: h.point, clusters: cs };
      }).filter((h) => h.clusters.length);
    } else {
      highlights = cl.slice(0, HL_MAX).map((c) => {
        const r = items[c.rep] || {};
        return { headline: zhTitle(c), point: r.summary_zh || r.summary || "", clusters: [c] };
      });
    }
    const used = new Set(highlights.flatMap((h) => h.clusters.map((c) => c.id)));
    const rest = cl.filter((c) => !used.has(c.id));
    return { summary: dg ? dg.summary : "", titles: (dg && dg.titles_zh) || {}, highlights, rest, total: cl.length };
  }

  function sourcesOf(cs) {
    const seen = new Map();
    cs.flatMap((c) => c.items).map((id) => items[id]).filter(Boolean).forEach((it) => {
      const k = pub(it); if (!seen.has(k)) seen.set(k, it);
    });
    return [...seen.values()];
  }

  function hlHTML(h) {
    const srcs = sourcesOf(h.clusters);
    const first = h.clusters[0];
    const hits = [...new Set(h.clusters.flatMap((c) => c.hits))];
    const orig = h.headline !== first.title ? `<div class="hl-orig">${esc(first.title)}</div>` : "";
    const links = srcs.slice(0, 5).map((it) => `<a class="src" href="${esc(it.link)}" target="_blank" rel="noopener">${esc(pub(it))}</a>`).join("");
    const extra = srcs.length > 5 ? `<span>等</span>` : "";
    return `<li>
      <a class="hl-title" href="${esc(first.link)}" target="_blank" rel="noopener">${esc(h.headline)}</a>
      ${orig}
      ${h.point ? `<div class="hl-point">${esc(h.point)}</div>` : ""}
      <div class="meta"><span class="cnt">${srcs.length} 家来源</span>${links}${extra}
        ${first.latest ? `<span>${fmtTime(first.latest)}</span>` : ""}
        ${hits.length ? `<span class="kw">● ${hits.map(esc).join(" · ")}</span>` : ""}</div>
    </li>`;
  }

  function restHTML(c, titles) {
    const zh = titles[c.id] || (items[c.rep] && items[c.rep].title_zh);
    const its = c.items.map((id) => items[id]).filter(Boolean);
    const srcList = its.length > 1
      ? `<details class="srcs"><summary><span class="cnt">${c.sources} 家来源 ▾</span></summary><ul>${its.map((it) =>
          `<li><a href="${esc(it.link)}" target="_blank" rel="noopener">${esc(it.title_zh || it.title)}</a> · ${esc(pub(it))}</li>`).join("")}</ul></details>`
      : `<span class="src">${esc(its[0] ? pub(its[0]) : "")}</span>`;
    return `<li>
      <a class="t" href="${esc(c.link)}" target="_blank" rel="noopener">${esc(zh || c.title)}</a>
      ${zh ? `<div class="hl-orig">${esc(c.title)}</div>` : ""}
      <div class="meta">${srcList}${c.latest ? `<span>${fmtTime(c.latest)}</span>` : ""}
        ${c.hits.length ? `<span class="kw">● ${c.hits.map(esc).join(" · ")}</span>` : ""}</div>
    </li>`;
  }

  function catSection(cat, overview) {
    const p = plan(cat.id);
    if (!p.total) return overview ? "" : `<div class="empty">今天这一类没有新内容</div>`;
    const hls = overview ? p.highlights.slice(0, OVERVIEW_HL) : p.highlights;
    let html = `<section class="cat"><div class="cat-head"><h2>${esc(cat.name)}</h2>
      ${overview ? `<button data-go="${cat.id}">全部 ${p.total} 条动态 →</button>` : `<span class="sub">共 ${p.total} 条动态</span>`}</div>`;
    if (p.summary) html += `<div class="summary"><div class="lbl">今日综述</div>${esc(p.summary)}</div>`;
    if (!overview && hls.length) html += `<div class="more-title">今日重点</div>`;
    html += `<ol class="hl">${hls.map(hlHTML).join("")}</ol>`;
    if (!overview && p.rest.length) {
      const show = expanded[cat.id] ? p.rest : p.rest.slice(0, REST_SHOW);
      html += `<div class="more-title">其他动态 · ${p.rest.length}</div><ul class="rest">${show.map((c) => restHTML(c, p.titles)).join("")}</ul>`;
      if (p.rest.length > REST_SHOW && !expanded[cat.id]) html += `<button class="expand" data-expand="${cat.id}">展开其余 ${p.rest.length - REST_SHOW} 条</button>`;
    }
    return html + `</section>`;
  }

  function searchHTML(q) {
    const res = day.items.filter((it) => [it.title, it.title_zh, it.summary, it.summary_zh, pub(it)].join(" ").toLowerCase().includes(q));
    if (!res.length) return `<div class="empty">没有找到"${esc(q)}"</div>`;
    return `<div class="more-title">搜索结果 · ${res.length}</div><ul class="rest">${res.map((it) => `<li>
      <a class="t" href="${esc(it.link)}" target="_blank" rel="noopener">${esc(it.title_zh || it.title)}</a>
      ${it.title_zh ? `<div class="hl-orig">${esc(it.title)}</div>` : ""}
      <div class="meta"><span class="src">${esc(pub(it))}</span><span>${fmtTime(it.published)}</span></div></li>`).join("")}</ul>`;
  }

  function render() {
    const tabs = [{ id: "overview", name: "总览" }].concat(day.categories);
    if (!tabs.some((t) => t.id === tab)) tab = "overview";
    const count = (id) => id === "overview" ? "" : day.clusters.filter((c) => c.category === id).length;
    $("tabs").innerHTML = tabs.map((t) => `<button data-id="${t.id}" class="${t.id === tab ? "on" : ""}">${esc(t.name)}<span class="n">${count(t.id)}</span></button>`).join("");
    const q = $("q").value.trim().toLowerCase();
    if (q) { $("main").innerHTML = searchHTML(q); return; }
    $("main").innerHTML = tab === "overview"
      ? day.categories.map((c) => catSection(c, true)).join("") || `<div class="empty">今天还没有内容</div>`
      : catSection(day.categories.find((c) => c.id === tab), false);
  }

  function renderFoot() {
    const ok = day.status.filter((s) => s.ok).length, bad = day.status.length - ok;
    const catName = Object.fromEntries(day.categories.map((c) => [c.id, c.name]));
    const note = day.digest
      ? `综述和要点由大模型（${esc(day.digest.model)}）根据标题和摘要整理，可能有出入，请以原文为准。` +
        (day.digest.errors && day.digest.errors.length ? `部分分类整理失败：${esc(day.digest.errors.join("；"))}` : "")
      : `今日重点按规则排序（来源数量、关注词）。${day.digest_note ? "未使用大模型：" + esc(day.digest_note) : ""}`;
    const rows = day.status.map((s) => `<tr><td>${esc(catName[s.category] || s.category)}</td><td>${esc(s.name)}</td>
      <td class="${s.ok ? "ok" : "err"}">${s.ok ? "正常" : "失败"}</td><td>${s.ok ? s.new : ""}</td><td>${esc(s.error)}</td></tr>`).join("");
    const t = day.translate || {}, nz = day.items.filter((i) => i.title_zh).length;
    const tr = nz ? `<p>英文标题和摘要为机器翻译，小字为原文${t.done < t.total ? `；本次有 ${t.total - t.done} 段未翻译成功，显示原文` : ""}。</p>` : "";
    $("foot").innerHTML = `<p>${note}</p>${tr}<details class="st"><summary>信息源 ${ok}/${day.status.length} 正常${bad ? `，<span class="err">${bad} 个失败</span>` : ""}（点击查看）</summary>
      <table class="st"><tr><th>分类</th><th>信息源</th><th>状态</th><th>当天条数</th><th>说明</th></tr>${rows}</table></details>`;
  }

  async function loadDay(d) {
    $("main").innerHTML = '<div class="empty">加载中…</div>';
    day = await getJSON(`data/days/${d}.json`);
    if (!day.clusters) day.clusters = day.items.map((it, i) => ({ id: "x" + i, category: it.category, title: it.title, link: it.link,
      items: [it.id], sources: 1, hits: it.hits || [], latest: it.published }));
    items = Object.fromEntries(day.items.map((it) => [it.id, it]));
    clusters = Object.fromEntries(day.clusters.map((c) => [c.id, c]));
    expanded = {};
    history.replaceState(null, "", "#date=" + d);
    $("sub").textContent = `${day.date} · 更新于 ${day.generated_at.slice(11, 16)}（北京时间）· ${day.items.length} 篇报道，合并为 ${day.clusters.length} 条动态`;
    render(); renderFoot();
  }

  async function init() {
    try {
      const idx = await getJSON("data/index.json");
      document.title = idx.title; $("title").textContent = idx.title;
      if (!idx.dates.length) { $("sub").textContent = "还没有数据"; return; }
      $("date").innerHTML = idx.dates.map((d) => `<option value="${d}">${d}</option>`).join("");
      const want = (location.hash.match(/date=([\d-]+)/) || [])[1];
      if (want && idx.dates.includes(want)) $("date").value = want;
      await loadDay($("date").value);
    } catch (e) { $("sub").textContent = "加载失败：" + e.message; }
  }

  $("tabs").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    tab = b.dataset.id; store.set("tab2", tab); $("q").value = ""; render(); window.scrollTo({ top: 0 });
  });
  $("main").addEventListener("click", (e) => {
    const go = e.target.closest("[data-go]");
    if (go) { tab = go.dataset.go; store.set("tab2", tab); render(); window.scrollTo({ top: 0 }); return; }
    const ex = e.target.closest("[data-expand]");
    if (ex) { expanded[ex.dataset.expand] = true; render(); }
  });
  $("date").addEventListener("change", () => loadDay($("date").value));
  $("q").addEventListener("input", render);
  init();
})();
</script>
</body>
</html>
